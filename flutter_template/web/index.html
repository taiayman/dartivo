<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A Flutter web app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flutter App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flutter App</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* CRITICAL: Prevent white flash */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1c1c1e;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    
    /* Custom loading screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1c1c1e;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.3s ease-out;
    }
    
    /* Loading content container */
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    /* App icon container */
    .app-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    
    /* Flutter launcher icon - much bigger */
    .app-icon img {
      width: 160px;
      height: 160px;
      border-radius: 32px;
    }
    
    /* Loading text */
    .loading-text {
      color: #ffffff;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
      opacity: 0.9;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    
    /* Fade out class */
    .fade-out {
      opacity: 0 !important;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Custom loading screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <!-- Squircle app icon -->
      <div class="app-icon">
        <img src="icons/Icon-192.png" alt="App Icon">
      </div>
      
      <!-- Loading text with counter -->
      <div class="loading-text" id="loading-counter">Loading(0)...</div>
    </div>
  </div>

  <script>
    // Loading counter animation
    let counter = 0;
    const loadingCounter = document.getElementById('loading-counter');
    const counterInterval = setInterval(() => {
      counter++;
      loadingCounter.textContent = `Loading(${counter})...`;
      if (counter >= 100) {
        clearInterval(counterInterval);
      }
    }, 50);

    // Remove loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      clearInterval(counterInterval);
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('fade-out');
        setTimeout(() => {
          loadingScreen.remove();
        }, 300);
      }
    });
    
    // Fallback: Remove loading screen after max time
    setTimeout(() => {
      clearInterval(counterInterval);
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.remove();
      }
    }, 8000); // 8 seconds max
  </script>
  
  <!-- Load Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
